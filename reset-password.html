<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Daeng Kuning - Pemulihan Akaun | Akademi Persilatan Daeng Kuning</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { gold: '#C5A059', dark: '#0D0D0D' } }
                }
            }
        }
    </script>
    <style>
        .premium-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            color: #f3f4f6;
            padding: 12px 2px 8px 36px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .premium-input:focus {
            outline: none;
            border-bottom: 1px solid #C5A059;
        }
        .premium-label {
            position: absolute;
            left: 36px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 0.9rem;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .premium-input:focus ~ .premium-label,
        .premium-input:not(:placeholder-shown) ~ .premium-label {
            top: -6px;
            left: 2px;
            font-size: 0.7rem;
            color: #C5A059;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }
        .premium-icon {
            position: absolute;
            left: 2px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 1.2rem;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen relative overflow-x-hidden bg-[#080808] flex items-center justify-center">

    <div class="fixed inset-0 z-0">
        <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover opacity-30 mix-blend-screen">
            <source src="assets/video/1.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-[#080808]/80 pointer-events-none"></div>
    </div>

    <div class="relative z-10 w-full max-w-sm mx-auto px-4">
        <div class="backdrop-blur-2xl bg-[#0d0d0d]/40 border border-brand-gold/20 rounded-2xl p-8 shadow-[0_0_50px_rgba(197,160,89,0.15)] ring-1 ring-white/[0.04] relative">
            <h2 class="font-serif text-xl text-white mb-2">Penetapan Semula <span class="text-brand-gold">Kata Laluan</span></h2>
            <p class="text-[10px] text-gray-400 mb-6 font-light uppercase tracking-widest">Sila masukkan kata laluan baharu</p>

            <form id="resetPasswordForm" class="space-y-5">
                <div id="reset-error" class="hidden text-rose-400 text-xs py-2 px-3 bg-rose-500/10 border border-rose-500/20 rounded"></div>
                <div id="reset-success" class="hidden text-green-400 text-xs py-2 px-3 bg-green-500/10 border border-green-500/20 rounded">Kata laluan berjaya diset semula! Kembali ke <a href="login.html" class="text-brand-gold underline font-bold">Log Masuk</a>.</div>
                
                <div class="relative">
                    <input type="password" id="new-password" placeholder=" " class="premium-input pr-10" required>
                    <label for="new-password" class="premium-label">Kata Laluan Baru</label>
                    <i class='bx bx-lock-alt premium-icon'></i>
                    <i class='bx bx-show absolute right-2 top-[35%] text-xl text-gray-500 hover:text-brand-gold cursor-pointer transition-colors z-20' id="toggle-pw-1" title="Papar Kata Laluan"></i>
                </div>

                <!-- Password Strength Meter -->
                <div class="-mt-1 mb-2">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="text-[9px] text-gray-500 uppercase tracking-widest">Kekuatan</span>
                        <span id="strength-text" class="text-[9px] text-gray-600 font-bold uppercase tracking-widest"></span>
                    </div>
                    <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden flex shadow-inner">
                        <div id="strength-bar" class="h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>

                <!-- Password Rules -->
                <ul class="text-[10px] space-y-1.5 text-gray-500 mb-2 font-light">
                    <li id="rule-length" class="flex items-center gap-1.5 transition-colors"><i class='bx bx-x text-red-500'></i> Minimum 6 aksara</li>
                    <li id="rule-upper" class="flex items-center gap-1.5 transition-colors"><i class='bx bx-x text-red-500'></i> Sekurang-kurangnya 1 huruf besar</li>
                    <li id="rule-number" class="flex items-center gap-1.5 transition-colors"><i class='bx bx-x text-red-500'></i> Mengandungi abjad & nombor</li>
                </ul>

                <div class="relative pb-2">
                    <input type="password" id="confirm-password" placeholder=" " class="premium-input pr-10" required>
                    <label for="confirm-password" class="premium-label">Sahkan Kata Laluan</label>
                    <i class='bx bx-check-shield premium-icon'></i>
                    <i class='bx bx-show absolute right-2 top-[20%] text-xl text-gray-500 hover:text-brand-gold cursor-pointer transition-colors z-20' id="toggle-pw-2" title="Papar Kata Laluan"></i>
                </div>
                
                <button type="submit" id="btnResetSubmit" disabled class="w-full py-3.5 bg-brand-gold hover:bg-[#D4AF37] text-black font-bold text-[10px] tracking-widest uppercase transition-all shadow-[0_0_18px_rgba(197,160,89,0.2)] rounded opacity-40 cursor-not-allowed mt-2 border border-yellow-200/50">
                    Sahkan Perubahan
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script>
        // Wait for DOM and all scripts to load before running
        document.addEventListener('DOMContentLoaded', async function() {
            const hash = window.location.hash;
            const params = new URLSearchParams(hash.replace('#', '?'));
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');
            const type = params.get('type');

            const errDiv = document.getElementById('reset-error');
            const form = document.getElementById('resetPasswordForm');

            if (type === 'recovery' && accessToken) {
                try {
                    const { error } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken || ''
                    });
                    if (error) throw error;
                    console.log('Recovery session established.');
                } catch(err) {
                    errDiv.innerText = 'Pautan ini telah tamat tempoh atau tidak sah. Sila mohon pautan baharu dari halaman Log Masuk.';
                    errDiv.classList.remove('hidden');
                    form.style.display = 'none';
                }
            } else {
                errDiv.innerText = 'Akses tidak sah. Sila gunakan pautan yang dihantar ke e-mel anda.';
                errDiv.classList.remove('hidden');
                form.style.display = 'none';
            }
        });

        const passInp = document.getElementById('new-password');
        const confInp = document.getElementById('confirm-password');
        const submitBtn = document.getElementById('btnResetSubmit');
        const errDiv = document.getElementById('reset-error');
        let isValid = false;

        // Toggle Visibility Logic
        function setupToggle(btnId, inpId) {
            document.getElementById(btnId).addEventListener('click', function() {
                const inp = document.getElementById(inpId);
                if (inp.type === 'password') {
                    inp.type = 'text';
                    this.classList.replace('bx-show', 'bx-hide');
                    this.classList.add('text-brand-gold');
                } else {
                    inp.type = 'password';
                    this.classList.replace('bx-hide', 'bx-show');
                    this.classList.remove('text-brand-gold');
                }
            });
        }
        setupToggle('toggle-pw-1', 'new-password');
        setupToggle('toggle-pw-2', 'confirm-password');

        // Strength Logic
        passInp.addEventListener('input', () => {
            const v = passInp.value;
            let score = 0;
            
            // Validation Rules
            const rLen = v.length >= 6;
            const rUp = /[A-Z]/.test(v);
            const rNum = /[a-zA-Z]/.test(v) && /[0-9]/.test(v);

            updateRuleNode('rule-length', rLen);
            updateRuleNode('rule-upper', rUp);
            updateRuleNode('rule-number', rNum);

            if(rLen) score++;
            if(rUp) score++;
            if(rNum) score++;
            if(v.length >= 10 && rLen && rUp && rNum) score++; // bonus for very strong

            const sBar = document.getElementById('strength-bar');
            const sTxt = document.getElementById('strength-text');

            if(v.length === 0) {
                sBar.style.width = '0%';
                sTxt.innerText = '';
            } else if(score <= 1) {
                sBar.style.width = '33%';
                sBar.className = 'h-full bg-red-500 transition-all duration-300';
                sTxt.innerText = 'Lemah';
                sTxt.className = 'text-[9px] font-bold uppercase tracking-widest text-red-500';
            } else if(score === 2) {
                sBar.style.width = '66%';
                sBar.className = 'h-full bg-yellow-500 transition-all duration-300 shadow-[0_0_10px_rgba(234,179,8,0.3)]';
                sTxt.innerText = 'Sederhana';
                sTxt.className = 'text-[9px] font-bold uppercase tracking-widest text-yellow-500';
            } else {
                sBar.style.width = '100%';
                sBar.className = 'h-full bg-green-500 transition-all duration-300 shadow-[0_0_10px_rgba(34,197,94,0.5)]';
                sTxt.innerText = 'Kuat';
                sTxt.className = 'text-[9px] font-bold uppercase tracking-widest text-green-500';
            }

            checkMatch();
        });

        confInp.addEventListener('input', checkMatch);

        function updateRuleNode(id, pass) {
            const node = document.getElementById(id);
            const i = node.querySelector('i');
            if(pass) {
                node.classList.add('text-green-400');
                node.classList.remove('text-gray-500');
                i.className = 'bx bx-check text-green-400 text-lg';
            } else {
                node.classList.add('text-gray-500');
                node.classList.remove('text-green-400');
                i.className = 'bx bx-x text-red-500 text-lg';
            }
        }

        function checkMatch() {
            const p1 = passInp.value;
            const p2 = confInp.value;
            const isBaseValid = p1.length >= 6; // Supabase only strictly requires 6 chars
            
            errDiv.classList.add('hidden');

            if (p1 && p2 && p1 !== p2) {
                isValid = false;
                errDiv.innerText = 'Kata laluan tidak sepadan.';
                errDiv.classList.remove('hidden');
                confInp.style.borderBottomColor = '#ef4444'; // Red border
            } else if (p1 && p1 === p2 && isBaseValid) {
                isValid = true;
                confInp.style.borderBottomColor = '#22c55e'; // Green border
            } else {
                isValid = false;
                confInp.style.borderBottomColor = 'rgba(197, 160, 89, 0.3)'; // Base border
            }

            if(isValid) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-40', 'cursor-not-allowed');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-40', 'cursor-not-allowed');
            }
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!isValid) return;

            const sucDiv = document.getElementById('reset-success');
            const newPassword = passInp.value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bx bx-loader-alt bx-spin mr-2"></i>Memproses...';
            errDiv.classList.add('hidden');
            sucDiv.classList.add('hidden');

            try {
                const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
                
                if (error) {
                    throw error;
                }

                sucDiv.classList.remove('hidden');
                passInp.value = '';
                confInp.value = '';
                submitBtn.style.display = 'none';

                // Automatically redirect to login after 3 seconds as a premium UX touch
                setTimeout(() => { window.location.href = 'login.html'; }, 3000);

            } catch(error) {
                errDiv.innerText = error.message || 'Pautan ini mungkin telah tamat tempoh. Sila mohon pautan baharu.';
                errDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sahkan Perubahan';
            }
        });
    </script>

    <script src="js/chatbot.js"></script>
</body>
</html>
